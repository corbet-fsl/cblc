[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cblc"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = ["host"]
host = ["cmbl/issuer", "dep:cssr", "dep:cvfy", "dep:cthl", "dep:cpns", "dep:futures", "dep:getrandom", "dep:hpke", "dep:rand", "dep:rand_chacha", "dep:rand_core", "dep:rs_merkle", "dep:zeroize"]
schema = ["dep:utoipa", "dep:schemars", "czkp/schema"]
publication = ["dep:cbcn"]

[dependencies]
cmbl = { git = "https://git.corbet.ch/corbet-foss/cmbl.git", branch = "v01" }
cbcn = { git = "https://git.corbet.ch/corbet-foss/cbcn", branch = "main", optional = true }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false }
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cthl = { git = "https://git.corbet.ch/corbet-foss/cthl", branch = "main", optional = true }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main" }
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy", branch = "main", optional = true }
cssr = { git = "https://git.corbet.ch/corbet-foss/cssr", branch = "main", optional = true }
data-encoding = "2.9"
ed25519-dalek = "2.2"
p256 = { version = "0.13", features = ["ecdsa"] }
getrandom = { version = "0.4", optional = true }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"], optional = true }
rand = { version = "0.10", optional = true }
rand_chacha = { version = "0.10", optional = true }
rand_core = { version = "0.10", optional = true }
rs_merkle = { version = "1.5", optional = true }
zeroize = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main", features = ["native-worker"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
jsonschema = { version = "0.58", default-features = false }
openssl = "0.10"
tempfile = "3"
