[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cblc"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
schema = ["dep:utoipa", "dep:schemars", "czkp/schema"]
publication = ["dep:cbcn", "dep:csgn"]

[dependencies]
cbcn = { git = "https://git.corbet.ch/corbet-foss/cbcn", branch = "main", optional = true }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, optional = true }
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cthl = { git = "https://git.corbet.ch/corbet-foss/cthl", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main", default-features = false }
futures = "0.3"
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main" }
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy", branch = "main" }
cssr = { git = "https://git.corbet.ch/corbet-foss/cssr", branch = "main" }
data-encoding = "2.9"
ed25519-dalek = "2.2"
getrandom = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
rand = "0.10"
rand_chacha = "0.10"
rand_core = "0.10"
rs_merkle = "1.5"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main", features = ["native-worker"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
