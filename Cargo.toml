[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cblc.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
schema = ["dep:utoipa", "dep:schemars", "czkp/schema", "cwlt/schema"]
publication = ["dep:cbcn"]

[dependencies]
cwlt = { git = "https://git.corbet.ch/corbet-foss/cwlt.git", branch = "v01", default-features = false }
cbcn = { git = "https://git.corbet.ch/corbet-foss/cbcn.git", branch = "v01", optional = true }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", default-features = false }
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cthl = { git = "https://git.corbet.ch/corbet-foss/cthl.git", branch = "v01" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns.git", branch = "v01", default-features = false }
futures = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
rand = "0.10"
rand_chacha = "0.10"
rand_core = "0.10"
rs_merkle = "1.5"
zeroize = "1"
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp.git", branch = "v01" }
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy.git", branch = "v01" }
cssr = { git = "https://git.corbet.ch/corbet-foss/cssr.git", branch = "v01" }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01" }
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
cwlt = { git = "https://git.corbet.ch/corbet-foss/cwlt.git", branch = "v01", default-features = false, features = ["native-verifier"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", default-features = false, features = ["volatile-signer"] }
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"

[[example]]
name = "wave_verifier"
required-features = ["publication"]
