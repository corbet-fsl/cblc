# Nightly source and runtime coverage over the retained fixtures of this commit.
[checks.coverage]
kind = "commands"
commands = [["bash", ".ci/coverage.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["wasm-pack", "--version"], ["jq", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS", "LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_pure = false
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json", "instrumented-build.json", "runtime-coverage/coverage-final.json", "runtime-coverage/coverage-summary.json", "runtime-coverage/lcov.info", "runtime-coverage/v8.json.tar.gz"]

[jobs.coverage]
environment = { CI_TIMEOUT = "7200" }
scheduler = "forgejo"
runs_on = "linux"
checks = ["coverage"]
workflow = "coverage"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories", "licenses"]]

[render]
render_schema = 2
[jobs.verify]
# Proof generation and the instrumented coverage run are separate jobs
# (proof-scenario, record-epoch, coverage); verify keeps the static gates, the
# native integration tests and the replays over the retained fixtures.
environment = { CI_TIMEOUT = "7200" }
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

# Maintenance job: resolves and retains an npm lock without claiming validation.
[checks.resolve-npm]
kind = "commands"
commands = [["bash", ".ci/resolve-npm.sh"]]
cache = false
cache_outputs = ["package-lock.json"]

[jobs.resolve-npm]
scheduler = "forgejo"
runs_on = "linux"
checks = ["resolve-npm"]
workflow = "resolve-npm"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "package-lock.json"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "linux"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

# Soundness of the genesis/update key split (tests/genesis_split.rs): needs the prebuilt, hash-pinned nargo 1.0.0-beta.26 and bb 5.2.1 (CBLC_NARGO, CBLC_BB_CLI), provided by
# .ci/genesis-split.sh; nothing is compiled for them.
[checks.genesis-split]
kind = "commands"
commands = [["bash", ".ci/genesis-split.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["node", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS", "LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_pure = false

[jobs.genesis-split]
environment = { CI_TIMEOUT = "7200" }
scheduler = "forgejo"
runs_on = "linux"
checks = ["genesis-split"]
workflow = "genesis-split"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[check_shell]
