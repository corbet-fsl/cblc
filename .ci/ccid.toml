schema = 1
project = "cblc"

# Bounded original public artifact relation. This does not compile or qualify
# the current Rust issuer, production host, accepted account or enrollment.
[checks.artifact-conformance]
kind = "commands"
commands = [["bash", ".ci/artifact-conformance.sh"]]
cache_pure = false
cache_outputs = ["artifact-conformance-worker.json"]

[jobs.artifact-conformance]
environment = { CI_TIMEOUT = "7200" }
scheduler = "crow"
checks = ["artifact-conformance"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

# All Linux verification gates from .github/workflows/ci.yml (jobs check,
# audit, dependency-policy, coverage) are ported into .ci/verify.sh in CI
# ordering. kind="cargo" is not used: gates need --locked/--all-features/
# --test/--no-fail-fast/-- --test-threads selection, cargo fmt failure capture
# ("> formatting.patch"), npm flags, node proof/extension pipelines, wasm-pack
# web build, metadata redirects, jq extraction of instrumented example paths,
# and a nightly coverage toolchain that the cargo kind cannot express.
# The advisory DB gate lives in [checks.advisories] and runs fresh on every
# invocation, never from cache.

# Peer-release relations (wave, outcome) on main's core: compile, ABI widths and
# verification keys only. No proof, witness or issuer acceptance.
[checks.wave-artifacts]
kind = "commands"
commands = [["bash", ".ci/wave-artifacts.sh"]]
cache_pure = false

[jobs.wave-artifacts]
environment = { CI_TIMEOUT = "7200" }
scheduler = "crow"
checks = ["wave-artifacts"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

# Real peer-release proofs (a wave reservation and an Answer outcome) in their own job,
# retained write-once under the fixture digest; verify never regenerates them.
[checks.proof-fixtures]
kind = "commands"
commands = [["bash", ".ci/proof-fixtures.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["wasm-pack", "--version"], ["jq", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS", "LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_pure = false

[jobs.proof-fixtures]
environment = { CI_TIMEOUT = "7200" }
scheduler = "crow"
checks = ["proof-fixtures"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

# Counterpart verification of the retained wave proofs by digest: native worker and wasm.
[checks.wave-verify]
kind = "commands"
commands = [["bash", ".ci/wave-verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["wasm-pack", "--version"], ["jq", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS", "LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_pure = false

[jobs.wave-verify]
environment = { CI_TIMEOUT = "7200" }
scheduler = "crow"
checks = ["wave-verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["wasm-pack", "--version"], ["jq", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS", "LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json", "instrumented-build.json", "runtime-coverage/coverage-final.json", "runtime-coverage/coverage-summary.json", "runtime-coverage/lcov.info", "runtime-coverage/v8.json.tar.gz"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories", "licenses"]]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
# Real native/Wasm proof generation plus fresh instrumented replay can exceed
# the default 45 minutes; preserve every gate with a bounded two-hour budget.
environment = { CI_TIMEOUT = "7200" }
scheduler = "crow"
checks = ["verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

# Maintenance job: resolves and retains an npm lock without claiming validation.
[checks.resolve-npm]
kind = "commands"
commands = [["bash", ".ci/resolve-npm.sh"]]
cache = false
cache_outputs = ["package-lock.json"]

[jobs.resolve-npm]
scheduler = "crow"
checks = ["resolve-npm"]
workflow = "npm-resolution"
command = ["bash", ".ci/run-cached.sh"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "package-lock.json"]

[jobs.resolve-dependencies]
scheduler = "crow"
checks = ["resolve-dependencies"]
workflow = "dependency-resolution"
command = ["bash", ".ci/run-cached.sh"]
