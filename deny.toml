[advisories]
# Narrow inherited libSQL exceptions; see docs/DEPENDENCIES.md.
ignore = [
    # RUSTSEC-2023-0071 (Marvin timing side channel in rsa, no patched release).
    # Justification: server-side blind-token issuer only; blinded private-key ops;
    # rate-limited issuance; backend replacement with a constant-time implementation
    # is a pre-beta debt. cmbl's issuer signs with OpenSSL (blinded by default), and
    # the rsa crate is reached only through public-key and verification paths.
    # Review/expiry: 2027-01-31.
    { id = "RUSTSEC-2023-0071" },
]

[licenses]
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC",
    "MIT", "MPL-2.0", "OpenSSL", "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "Zlib",
    "LGPL-3.0-only WITH LGPL-3.0-linking-exception",
]
confidence-threshold = 0.8

# Unpublished workspace crates have repository-reviewed FSL/LGPL licences.
[licenses.private]
ignore = true
